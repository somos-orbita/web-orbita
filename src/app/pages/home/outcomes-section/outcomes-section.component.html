<section class="section outcomes scroll-reveal" id="resultados">
  <div class="container">
    <div class="section-head">
      <p class="kicker">Resultado</p>
      <h2 class="section-title">Resultados visibles en la forma en que opera tu equipo.</h2>
      <p class="section-copy">
        Medimos la mejora en menos carga manual, más trazabilidad, mejor tiempo de respuesta
        y procesos conectados alrededor del negocio.
      </p>
    </div>

    <div class="metric-grid">
      <article class="metric-card" *ngFor="let metric of metrics">
        <span>{{ metric.value }}</span>
        <strong>{{ metric.label }}</strong>
        <p>{{ metric.text }}</p>
      </article>
    </div>
  </div>
</section>
