<section class="section method scroll-reveal" id="metodo">
  <div class="container">
    <div class="section-head">
      <p class="kicker">Método</p>
      <h2 class="section-title">Avanzamos desde diagnóstico claro hacia ejecución medible.</h2>
    </div>

    <div class="steps auto-grid">
      <article *ngFor="let step of steps">
        <span>{{ step[0] }}</span>
        <h3>{{ step[1] }}</h3>
        <p>{{ step[2] }}</p>
      </article>
    </div>
  </div>
</section>
