<section class="section section-muted cases scroll-reveal" id="casos">
  <div class="container section-grid">
    <div>
      <p class="kicker">Casos de uso</p>
      <h2 class="section-title">Procesos donde la automatización puede generar impacto concreto.</h2>
    </div>

    <div class="case-list">
      <article class="case-card glass-card" *ngFor="let item of cases">
        <img [src]="item.image" [alt]="item.alt">
        <div>
          <span>{{ item.title }}</span>
          <strong>{{ item.label }}</strong>
          <p>{{ item.text }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
